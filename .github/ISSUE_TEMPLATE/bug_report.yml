name: Bug report
description: Report a defect in the SoundCharts for ArcGIS add-in, its build or its tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and triage quickly.

        **Do not attach real ENC data files.** Use small synthetic fixtures or
        describe the data structure instead.

        If the chart looks the same in the SoundCharts app or with `s100`, the
        problem is in portrayal: report it to
        [EncDotNet.S100](https://github.com/philliphoff/EncDotNet.S100/issues/new/choose).

        For security vulnerabilities, do **not** use this form — see
        [SECURITY.md](https://github.com/philliphoff/EncDotNet.ArcGIS/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the add-in is affected? Pick the closest match.
      options:
        - "Ribbon, panes and dialogs"
        - "Adding data and chart layers"
        - "Palette and mariner settings"
        - "Time-varying layers (S-104, S-111)"
        - "Object information"
        - "Route checking"
        - "Printing and export"
        - "Geoprocessing tools"
        - "Chart server"
        - "Install and loading"
        - "Build / CI / packaging"
        - "Docs"
        - "Other / unsure"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, Pro's notifications, or screenshots as appropriate.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        On the **SoundCharts** tab, choose **About SoundCharts**, then
        **Copy**, and paste here. If the add-in doesn't load, give the
        ArcGIS Pro version (**Project** > **About**) and the add-in build.
      render: text
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Add-in log (optional)
      description: |
        The last lines of `%LOCALAPPDATA%\SoundCharts for ArcGIS\Logs\addin.log`.
      render: text

  - type: textarea
    id: data
    attributes:
      label: Dataset / fixture (optional)
      description: |
        Describe the data needed to reproduce. Attach a small **synthetic**
        fixture if helpful. Do not attach real ENC data.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else.
