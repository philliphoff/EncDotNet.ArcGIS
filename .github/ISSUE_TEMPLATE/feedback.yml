name: Feedback
description: Ask a question, or tell us what worked, what didn't, or what could be better in SoundCharts for ArcGIS.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feedback! It doesn't need to be a bug or a fully
        formed feature request: questions and usage help belong here too.

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What happened, what could be improved, or what would you like to know?
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: |
        Paste a screenshot with **Ctrl+V**, or drag an image file here. You
        can leave this empty.

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        On the **SoundCharts** tab, choose **About SoundCharts**, then
        **Copy**, and paste here. Edit or delete anything you don't want to
        share.
      render: text
