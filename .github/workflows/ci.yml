name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # ArcGIS Pro add-ins are Windows-only, and Esri's packaging targets need
    # Visual Studio's MSBuild (they use CodeTaskFactory, which the .NET
    # MSBuild doesn't support). Pro isn't installed on the runner: the Pro API
    # reference assemblies come from the Esri.ArcGISPro.Extensions30 package.
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          # The git tag is the source of truth for a released version. On a
          # tag build (refs/tags/v*) derive the version from the tag name; on
          # branch/PR builds fall back to the dev placeholder in props.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oE '<Version>[^<]+' src/Directory.Build.props | sed 's/<Version>//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read the chart server pin
        id: server
        shell: pwsh
        run: |
          $pin = Get-Content -Raw tools/s100-server.json | ConvertFrom-Json
          "commit=$($pin.commit)" >> $env:GITHUB_OUTPUT

      # The add-in bundles a pinned s100 build (design brief D21): no
      # EncDotNet.S100 release serves WMTS yet, so tools/build-server.ps1
      # publishes the CLI from the commit in tools/s100-server.json. It takes
      # a few minutes, so the result is cached by commit and script.
      - name: Cache the chart server
        id: server-cache
        uses: actions/cache@v4
        with:
          path: artifacts/server
          key: s100-server-${{ steps.server.outputs.commit }}-${{ hashFiles('tools/build-server.ps1', 'tools/s100-server.json') }}

      - name: Build the chart server
        if: steps.server-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # A short source folder: the upstream build writes deep paths.
        run: tools/build-server.ps1 -SourceDirectory "${{ runner.temp }}\s100"

      - name: Build and package
        run: >
          msbuild EncDotNet.ArcGIS.slnx
          /restore
          /p:Configuration=Release
          /p:Version=${{ steps.version.outputs.version }}
          /m
          /nologo
          /bl:msbuild.binlog

      - name: Check out EncDotNet.S100 test datasets
        # Object information's coverage tests (S-102, S-104, S-111) and Add
        # SoundCharts Data's content detection tests (S-57, S-101 exchange
        # set and its .zip, S-124) and the route check tests (S-57, and the
        # S-421 and RTZ route fixtures) use EncDotNet.S100's own test
        # datasets, so no real data is committed here. Cone mode also brings the files at
        # tests/datasets itself, S101.zip among them. Keep the ref in step
        # with EncDotNetS100Version.
        uses: actions/checkout@v7
        with:
          repository: philliphoff/EncDotNet.S100
          ref: v0.27.0
          path: s100-datasets
          sparse-checkout: |
            tests/datasets/S57
            tests/datasets/S101
            tests/datasets/S102
            tests/datasets/S104
            tests/datasets/S111
            tests/datasets/S124
            tests/datasets/S421
            tests/datasets/RTZ
          sparse-checkout-cone-mode: true

      - name: Test
        env:
          SOUNDCHARTS_S100_TEST_DATASETS: ${{ github.workspace }}/s100-datasets/tests/datasets
        run: dotnet test EncDotNet.ArcGIS.slnx --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-binlog
          path: msbuild.binlog
          if-no-files-found: ignore

      - name: Upload add-in
        uses: actions/upload-artifact@v7
        with:
          name: addin
          path: src/EncDotNet.ArcGIS.SoundCharts/bin/Release/net10.0-windows/win-x64/EncDotNet.ArcGIS.SoundCharts.esriAddinX
          if-no-files-found: error

  format:
    name: Format check
    # Windows, like the build: .gitattributes checks text out with LF here
    # too, and the projects target Windows.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EncDotNet.ArcGIS.slnx

      - name: Verify formatting and naming
        # The root command verifies whitespace while the diagnostic filter
        # limits code-style analysis to using directives (IDE0005) and naming
        # (IDE1006). Keeping one invocation avoids loading the solution
        # separately for each rule.
        run: >
          dotnet format EncDotNet.ArcGIS.slnx
          --diagnostics IDE0005 IDE1006
          --severity warn
          --no-restore
          --verify-no-changes
